<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Дата торжества</title>

    <link rel="stylesheet" href="date.css">
</head>

<body>

    <main class="date-page">

        <div class="date-page__content">

            <div class="date-page__ornament">
                ❦
            </div>

            <p class="date-page__subtitle">
                СОХРАНИТЕ ЭТУ ДАТУ
            </p>

            <div class="date-page__date">

                <span class="date-page__day">
                    25
                </span>

                <span class="date-page__month">
                    сентября
                </span>

                <span class="date-page__year">
                    2026
                </span>

            </div>

            <div class="date-page__divider">
                <span></span>
                <i>❦</i>
                <span></span>
            </div>

            <div class="date-page__time">
                17:00
            </div>

            <p class="date-page__description">
                Начало торжества
            </p>

            <!-- ПЕРЕХОД НА 4 СТРАНИЦУ -->

            <a href="location.html" class="date-page__button">
                <span>Далее</span>
                <b>→</b>
            </a>

        </div>

    </main>

</body>

</html>
