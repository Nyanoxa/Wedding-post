<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Самат & Аружан</title>


    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            min-height: 100%;
        }


        body {
            min-height: 100vh;

            background: #f4efe4;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            color: #5a4035;

            opacity: 0;

            animation:
                pageAppear 1.2s ease forwards;

            transition:
                opacity 0.8s ease,
                transform 0.8s ease;
        }


        /* =========================
           ПОЯВЛЕНИЕ
        ========================= */

        @keyframes pageAppear {

            from {
                opacity: 0;
                transform: scale(1.02);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }

        }


        /* =========================
           УХОД
        ========================= */

        body.leaving {
            opacity: 0;

            transform:
                scale(0.98);
        }


        /* =========================
           ОСНОВА
        ========================= */

        .welcome {
            width: 100%;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 60px 25px;

            text-align: center;

            position: relative;

            overflow: hidden;
        }



        /* =========================
           КОНТЕНТ
        ========================= */

        .welcome__content {

            width: 100%;

            max-width: 650px;

            display: flex;

            flex-direction: column;

            align-items: center;
        }


        /* =========================
           ОРНАМЕНТ
        ========================= */

        .welcome__ornament {

            font-size: 38px;

            line-height: 1;

            color: #b49a6c;

            margin-bottom: 30px;

            animation:
                fadeUp 0.8s 0.2s both;
        }


        /* =========================
           ПОДЗАГОЛОВОК
        ========================= */

        .welcome__subtitle {

            font-size: 12px;

            letter-spacing: 5px;

            color: #806b5d;

            margin-bottom: 24px;

            animation:
                fadeUp 0.8s 0.35s both;
        }


        /* =========================
           ЗАГОЛОВОК
        ========================= */

        .welcome__title {

            font-family:
                "Times New Roman",
                Georgia,
                serif;

            font-size:
                clamp(42px, 7vw, 64px);

            font-weight: normal;

            line-height: 1.1;

            color: #5a4035;

            animation:
                fadeUp 0.9s 0.5s both;
        }


        /* =========================
           РАЗДЕЛИТЕЛЬ
        ========================= */

        .welcome__divider {

            width: 170px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 12px;

            margin: 35px 0;

            animation:
                fadeUp 0.8s 0.65s both;
        }


        .welcome__divider span {

            width: 55px;

            height: 1px;

            background: #b49a6c;
        }


        .welcome__divider i {

            font-style: normal;

            color: #b49a6c;

            font-size: 14px;
        }


        /* =========================
           ТЕКСТ
        ========================= */

        .welcome__text {

            max-width: 540px;

            font-size: 18px;

            line-height: 1.9;

            color: #6b5146;

            margin-bottom: 12px;

            animation:
                fadeUp 0.8s 0.8s both;
        }


        /* =========================
           ИМЕНА
        ========================= */

        .welcome__names {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 16px;

            margin-top: 28px;

            font-family:
                "Times New Roman",
                Georgia,
                serif;

            font-size: 30px;

            color: #60443a;

            animation:
                fadeUp 0.8s 0.95s both;
        }


        .welcome__names .ampersand {

            color: #b49a6c;

            font-size: 22px;
        }


        /* =========================
           КНОПКА ДАЛЕЕ
        ========================= */

        .next-page-button {

            margin-top: 48px;

            width: 170px;

            height: 52px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 18px;

            background: #4b3c31;

            border: 1px solid #4b3c31;

            color: #f4efe4;

            text-decoration: none;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 13px;

            letter-spacing: 2px;

            cursor: pointer;

            transition:
                background 0.4s ease,
                color 0.4s ease,
                transform 0.4s ease,
                box-shadow 0.4s ease;

            animation:
                fadeUp 0.8s 1.1s both;
        }


        .next-page-button b {

            font-size: 19px;

            font-weight: normal;

            transition:
                transform 0.4s ease;
        }


        .next-page-button:hover {

            background: #604c3d;

            color: #ffffff;

            transform:
                translateY(-3px);

            box-shadow:
                0 10px 25px rgba(72, 53, 38, 0.18);
        }


        .next-page-button:hover b {

            transform:
                translateX(5px);
        }


        .next-page-button:active {

            transform:
                translateY(0);
        }


        /* =========================
           АНИМАЦИЯ
        ========================= */

        @keyframes fadeUp {

            from {

                opacity: 0;

                transform:
                    translateY(18px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }

        }


        /* =========================
           ТЕЛЕФОН
        ========================= */

        @media (max-width: 500px) {

            .welcome {

                padding: 50px 20px;
            }


            .welcome__ornament {

                font-size: 32px;

                margin-bottom: 25px;
            }


            .welcome__subtitle {

                font-size: 9px;

                letter-spacing: 3px;

                margin-bottom: 20px;
            }


            .welcome__title {

                font-size: 40px;
            }


            .welcome__divider {

                width: 150px;

                margin: 28px 0;
            }


            .welcome__divider span {

                width: 45px;
            }


            .welcome__text {

                max-width: 350px;

                font-size: 17px;

                line-height: 1.8;
            }


            .welcome__names {

                font-size: 27px;

                gap: 12px;

                margin-top: 24px;
            }


            .next-page-button {

                width: 160px;

                height: 50px;

                margin-top: 40px;
            }

        }
    </style>

</head>


<body>

    <main class="welcome">

        <div class="welcome__content">

            <div class="welcome__ornament">
                ❦
            </div>


            <p class="welcome__subtitle">
                ДОРОГИЕ НАШИ ГОСТИ
            </p>


            <h1 class="welcome__title">
                Самат & Аружан
            </h1>


            <div class="welcome__divider">

                <span></span>

                <i>❦</i>

                <span></span>

            </div>


            <p class="welcome__text">
                С большой радостью приглашаем вас
                разделить с нами этот особенный день.
            </p>


            <p class="welcome__text">
                Для нас будет большой честью видеть вас
                рядом в этот важный момент нашей жизни.
            </p>


            <div class="welcome__names">

                <span>Самат</span>

                <span class="ampersand">&</span>

                <span>Аружан</span>

            </div>


            <a id="nextButton" class="next-page-button" href="date.html">

                <span>Далее</span>

                <b>→</b>

            </a>

        </div>

    </main>


    <script>

        const nextButton =
            document.getElementById("nextButton");


        nextButton.addEventListener(
            "click",
            function (event) {

                event.preventDefault();


                document.body.classList.add(
                    "leaving"
                );


                setTimeout(
                    function () {

                        window.location.href =
                            "date.html";

                    },
                    800
                );

            }
        );

    </script>

</body>

</html>
